name: imaji_rebuild_budget
description: >-
  Fail Flutter widget tests when a widget rebuilds more than its measured
  budget. A Dart test helper for catching unnecessary widget rebuilds:
  headless, no device, no probes in production code.
version: 0.1.0
homepage: https://github.com/saimskywalker/flutter-imaji-rebuild-budget
repository: https://github.com/saimskywalker/flutter-imaji-rebuild-budget
issue_tracker: https://github.com/saimskywalker/flutter-imaji-rebuild-budget/issues

topics:
  - flutter
  - testing
  - performance
  - widget-test
  - rebuild

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
