name: Feature request
description: Suggest a matcher, a budget kind or an API this package should have.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which rebuilds do you want to catch, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: A sketch of the test you would like to write is ideal.
      render: dart
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: ai-use
    attributes:
      label: Did you use an AI tool to write this issue?
      options:
        - "No"
        - "Yes, for parts"
        - "Yes, mostly"
    validations:
      required: true
  - type: input
    id: ai-tool
    attributes:
      label: If yes, which tool and model?
      description: Required if you answered yes above.
      placeholder: "e.g. Claude Code, Opus 5.5"
  - type: checkboxes
    id: own-words
    attributes:
      label: Your own words
      options:
        - label: I wrote this issue in my own words.
          required: true
